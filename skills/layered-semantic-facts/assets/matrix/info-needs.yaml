schema_version: 1
identifier_note: 占位标识：need.<事实类型slug>，待 add-semantic-fact-constructor 信息需求清单对齐后统一替换
needs:
- id: need.project.domain
  layer: 项目层
  fact_type: 项目用途/领域
  required_info: Cargo.toml description/readme、README 入口；领域描述归纳
  evidence:
    source: openspec/changes/survey-info-acquisition-tools/research/semantic-tooling-survey.md
    line_start: 15
    line_end: 15
- id: need.project.modules
  layer: 项目层
  fact_type: 模块划分
  required_info: workspace 成员/顶层 mod 清单；职责一句话归纳
  evidence:
    source: openspec/changes/survey-info-acquisition-tools/research/semantic-tooling-survey.md
    line_start: 16
    line_end: 16
- id: need.project.entries
  layer: 项目层
  fact_type: 入口
  required_info: bin target 清单、src/main.rs 位置、启动命令
  evidence:
    source: openspec/changes/survey-info-acquisition-tools/research/semantic-tooling-survey.md
    line_start: 17
    line_end: 17
- id: need.project.build_run
  layer: 项目层
  fact_type: 构建与运行形态
  required_info: 构建/测试/运行命令、crate_type（lib/bin）、部署形态归纳
  evidence:
    source: openspec/changes/survey-info-acquisition-tools/research/semantic-tooling-survey.md
    line_start: 18
    line_end: 18
- id: need.project.configs
  layer: 项目层
  fact_type: 配置项
  required_info: 配置文件/环境变量清单、用途、缺省值
  evidence:
    source: openspec/changes/survey-info-acquisition-tools/research/semantic-tooling-survey.md
    line_start: 19
    line_end: 19
- id: need.project.dependencies
  layer: 项目层
  fact_type: 外部依赖
  required_info: 依赖清单（normal/dev/build）、用途归类
  evidence:
    source: openspec/changes/survey-info-acquisition-tools/research/semantic-tooling-survey.md
    line_start: 20
    line_end: 20
- id: need.module.responsibility
  layer: 模块层
  fact_type: 模块职责
  required_info: 模块路径、职责描述、暴露能力
  evidence:
    source: openspec/changes/survey-info-acquisition-tools/research/semantic-tooling-survey.md
    line_start: 21
    line_end: 21
- id: need.module.dependencies
  layer: 模块层
  fact_type: 模块间依赖
  required_info: 依赖方向、依赖类型（调用/数据/配置）
  evidence:
    source: openspec/changes/survey-info-acquisition-tools/research/semantic-tooling-survey.md
    line_start: 22
    line_end: 22
- id: need.module.public_interface
  layer: 模块层
  fact_type: 对外接口
  required_info: 模块 pub 入口清单（指向符号层）
  evidence:
    source: openspec/changes/survey-info-acquisition-tools/research/semantic-tooling-survey.md
    line_start: 23
    line_end: 23
- id: need.symbol.public_api
  layer: 符号层
  fact_type: 公共接口
  required_info: 签名、可见性、所属模块
  evidence:
    source: openspec/changes/survey-info-acquisition-tools/research/semantic-tooling-survey.md
    line_start: 24
    line_end: 24
- id: need.symbol.types
  layer: 符号层
  fact_type: 类型定义
  required_info: struct/enum/trait 及字段/variant
  evidence:
    source: openspec/changes/survey-info-acquisition-tools/research/semantic-tooling-survey.md
    line_start: 25
    line_end: 25
- id: need.symbol.relations
  layer: 符号层
  fact_type: 符号关系
  required_info: trait 实现（impl T for U）、supertrait、符号-模块归属
  evidence:
    source: openspec/changes/survey-info-acquisition-tools/research/semantic-tooling-survey.md
    line_start: 26
    line_end: 26
- id: need.symbol.intent
  layer: 符号层
  fact_type: 意图声明
  required_info: doc 注释（`///`/`//!`）原文，与符号绑定
  evidence:
    source: openspec/changes/survey-info-acquisition-tools/research/semantic-tooling-survey.md
    line_start: 27
    line_end: 27
- id: need.fact_a.call_relation
  layer: 事实层A
  fact_type: 调用关系
  required_info: caller→callee、调用条件线索
  evidence:
    source: openspec/changes/survey-info-acquisition-tools/research/semantic-tooling-survey.md
    line_start: 28
    line_end: 28
- id: need.fact_a.dataflow
  layer: 事实层A
  fact_type: 数据流
  required_info: 关键数据产生→传递→消费路径
  evidence:
    source: openspec/changes/survey-info-acquisition-tools/research/semantic-tooling-survey.md
    line_start: 29
    line_end: 29
- id: need.fact_a.lifecycle
  layer: 事实层A
  fact_type: 生命周期/状态
  required_info: 资源创建/释放（RAII/Drop）、状态迁移
  evidence:
    source: openspec/changes/survey-info-acquisition-tools/research/semantic-tooling-survey.md
    line_start: 30
    line_end: 30
- id: need.fact_a.error_handling
  layer: 事实层A
  fact_type: 错误处理
  required_info: 错误类型、传播方式（`?`/match）、恢复策略
  evidence:
    source: openspec/changes/survey-info-acquisition-tools/research/semantic-tooling-survey.md
    line_start: 31
    line_end: 31
- id: need.fact_a.behavior_contract
  layer: 事实层A
  fact_type: 行为约定
  required_info: 不变量、副作用、并发/时序约束
  evidence:
    source: openspec/changes/survey-info-acquisition-tools/research/semantic-tooling-survey.md
    line_start: 32
    line_end: 32
- id: need.fact_a.usage_contract
  layer: 事实层A
  fact_type: 使用契约
  required_info: 前置条件、参数约束、返回保证
  evidence:
    source: openspec/changes/survey-info-acquisition-tools/research/semantic-tooling-survey.md
    line_start: 33
    line_end: 33
- id: need.fact_b.element_semantics
  layer: 事实层B
  fact_type: 元素实现语义
  required_info: 行为摘要、控制流结构（分支/循环）、变量级数据流
  evidence:
    source: openspec/changes/survey-info-acquisition-tools/research/semantic-tooling-survey.md
    line_start: 34
    line_end: 34
- id: need.fact_a.call_condition
  layer: 事实层A
  fact_type: 调用条件线索
  required_info: 调用条件线索（caller→callee 的调用条件）
  evidence:
    source: openspec/changes/survey-info-acquisition-tools/research/semantic-tooling-survey.md
    line_start: 100
    line_end: 100
