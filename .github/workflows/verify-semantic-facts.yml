name: Verify semantic facts
on:
  push:
    branches: [main, chore/verify-implementation-20261025]
  pull_request:
  workflow_dispatch:
jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r skills/layered-semantic-facts/scripts/requirements.txt
      - name: Repository tests
        env:
          PYTHONPATH: skills/layered-semantic-facts/scripts
        run: python -m pytest tests/repository -q -ra -p no:cacheprovider
      - name: Capability matrix tests
        env:
          PYTHONPATH: skills/layered-semantic-facts/scripts
        run: python -m pytest tests/capability_matrix -q -ra -p no:cacheprovider
      - name: Contract validation
        run: python openspec/changes/epic-layered-semantic-fact-skill/validation/validate_contracts.py
      - name: Product delivery gate
        run: python scripts/quality_gates/check_product_delivery.py
  openspec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --global @fission-ai/openspec
      - name: Strict OpenSpec validation
        run: |
          set -e
          for change in openspec/changes/*; do
            [ -d "$change" ] || continue
            [ "$(basename "$change")" = archive ] && continue
            openspec validate "$(basename "$change")" --strict --no-interactive
          done
