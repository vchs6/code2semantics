name: Verify semantic facts
on:
  push:
    branches: [main, chore/verify-implementation-20261025]
  pull_request:
  workflow_dispatch:
jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r skills/layered-semantic-facts/scripts/requirements.txt
      - name: Probe optional information-acquisition tool candidates
        run: python scripts/research/probe_candidate_tools.py
      - name: Repository tests
        env:
          PYTHONPATH: skills/layered-semantic-facts/scripts
        run: python -m pytest tests/repository -q -ra -p no:cacheprovider
      - name: Transaction tests
        env:
          PYTHONPATH: skills/layered-semantic-facts/scripts
        run: python -m pytest tests/repository/test_transactions.py -q -ra -p no:cacheprovider
      - name: Transfer tests
        env:
          PYTHONPATH: skills/layered-semantic-facts/scripts
        run: python -m pytest tests/repository/test_transfer.py -q -ra -p no:cacheprovider
      - name: Repository acceptance tests
        env:
          PYTHONPATH: skills/layered-semantic-facts/scripts
        run: python -m pytest tests/repository/test_acceptance.py -q -ra -p no:cacheprovider
      - name: Capability matrix tests
        env:
          PYTHONPATH: skills/layered-semantic-facts/scripts
        run: python -m pytest tests/capability_matrix -q -ra -p no:cacheprovider
      - name: Parser component tests
        env:
          PYTHONPATH: skills/layered-semantic-facts/scripts
        run: python -m pytest tests/test_info_parser.py -q -ra -p no:cacheprovider
      - name: Source scanner component tests
        env:
          PYTHONPATH: skills/layered-semantic-facts/scripts
        run: python -m pytest tests/test_source_scanner.py -q -ra -p no:cacheprovider
      - name: Runtime acceptance tests
        env:
          PYTHONPATH: skills/layered-semantic-facts/scripts
        run: python -m pytest tests/test_acceptance.py tests/test_manifest_acceptance.py -q -ra -p no:cacheprovider
      - name: Copied Skill packaging tests
        env:
          PYTHONPATH: skills/layered-semantic-facts/scripts
        run: python -m pytest tests/test_packaging.py -q -ra -p no:cacheprovider
      - name: Bounded tool executor tests
        env:
          PYTHONPATH: skills/layered-semantic-facts/scripts
        run: python -m pytest tests/test_tool_executor.py -q -ra -p no:cacheprovider
      - name: Producer dispatch tests
        env:
          PYTHONPATH: skills/layered-semantic-facts/scripts
        run: python -m pytest tests/test_producer_dispatch.py -q -ra -p no:cacheprovider
      - name: Information-needs and constructor plan tests
        env:
          PYTHONPATH: skills/layered-semantic-facts/scripts:tests
        run: python -m pytest tests/test_information_needs.py tests/test_constructor_plan.py tests/test_constructor.py tests/test_constructor_contributions.py tests/test_constructor_binding.py tests/test_induction.py tests/test_query_orchestration.py -q -ra -p no:cacheprovider
      - name: Contract validation
        run: python openspec/changes/epic-layered-semantic-fact-skill/validation/validate_contracts.py
      - name: Quality gate unit tests
        run: python -m pytest tests/test_quality_gates.py -q -ra -p no:cacheprovider
      - name: Product delivery gate
        run: python scripts/quality_gates/check_product_delivery.py
  openspec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --global @fission-ai/openspec
      - name: Strict OpenSpec validation
        run: |
          set -e
          for change in openspec/changes/*; do
            [ -d "$change" ] || continue
            [ "$(basename "$change")" = archive ] && continue
            openspec validate "$(basename "$change")" --strict --no-interactive
          done
